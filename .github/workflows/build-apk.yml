name: Build NEXORA APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Bundle Capacitor audio route bridge
        run: npx esbuild www/js/lib/audio-route.js --bundle --format=esm --platform=browser --outfile=www/js/lib/audio-route.bundle.js
      - name: Check JavaScript syntax
        run: |
          for f in $(find www/js -type f -name '*.js'); do
            node --input-type=module --check < "$f"
          done
      - name: Add Android platform
        run: npx cap add android
      - name: Firebase config + manifest permissions
        run: |
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            echo "google-services.json installed"
          else
            echo "::warning::firebase/google-services.json missing - push notifications disabled in this build"
          fi
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$P" $M || sed -i "/android.permission.INTERNET/a\\    <uses-permission android:name=\"android.permission.$P\" />" $M
          done
          grep -n "uses-permission" $M
      - name: App icon + name
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26 $R/drawable-land* $R/drawable-port* 2>/dev/null || true
          for d in branding/res/mipmap-*; do mkdir -p $R/$(basename $d); cp $d/*.png $R/$(basename $d)/; done
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">NEXORA</string>|; s|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">NEXORA</string>|' $R/values/strings.xml
          grep -n "app_name" $R/values/strings.xml
      - name: Add native Android call audio routing
        run: |
          mkdir -p android/app/src/main/java/com/m17/social
          cat > android/app/src/main/java/com/m17/social/AudioRoutePlugin.java <<'EOF'
          package com.m17.social;

          import android.content.Context;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.os.Build;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AudioRoute")
          public class AudioRoutePlugin extends Plugin {
            @PluginMethod
            public void setSpeaker(PluginCall call) {
              Boolean enabled = call.getBoolean("enabled");
              if (enabled == null) enabled = false;
              try {
                AudioManager audio = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                audio.setMode(AudioManager.MODE_IN_COMMUNICATION);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                  AudioDeviceInfo target = null;
                  for (AudioDeviceInfo device : audio.getAvailableCommunicationDevices()) {
                    if (enabled && device.getType() == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER) target = device;
                    if (!enabled && device.getType() == AudioDeviceInfo.TYPE_BUILTIN_EARPIECE) target = device;
                  }
                  try {
                    if (target != null) {
                      if (!audio.setCommunicationDevice(target)) {
                        audio.setSpeakerphoneOn(enabled);
                      }
                    } else {
                      // Some Android vendors omit the earpiece from the communication-device list.
                      // Clearing the explicit route restores the system default; use legacy routing
                      // as a fallback so a missing device entry does not fail the UI action.
                      if (!enabled) audio.clearCommunicationDevice();
                      audio.setSpeakerphoneOn(enabled);
                    }
                  } catch (Exception routeError) {
                    // Vendor WebView/audio HAL implementations differ; retain a legacy fallback.
                    audio.setSpeakerphoneOn(enabled);
                  }
                } else {
                  audio.setSpeakerphoneOn(enabled);
                }
                JSObject result = new JSObject();
                result.put("speaker", enabled);
                call.resolve(result);
              } catch (Exception error) {
                call.reject("Unable to change Android audio route", error);
              }
            }
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/m17/social/MainActivity.java")
          s = p.read_text()
          if "registerPlugin(AudioRoutePlugin.class)" not in s:
              s = s.replace("    super.onCreate(savedInstanceState);", "    registerPlugin(AudioRoutePlugin.class);\n    super.onCreate(savedInstanceState);")
          p.write_text(s)
          PY
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: M17-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
