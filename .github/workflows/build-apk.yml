name: Build M17 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Firebase config + manifest permissions
        run: |
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            echo "google-services.json installed"
          else
            echo "::warning::firebase/google-services.json missing - push notifications disabled in this build"
          fi
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$P" $M || sed -i "/android.permission.INTERNET/a\\    <uses-permission android:name=\"android.permission.$P\" />" $M
          done
          grep -n "uses-permission" $M
      - name: App icon + name
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26 $R/drawable-land* $R/drawable-port* 2>/dev/null || true
          for d in branding/res/mipmap-*; do mkdir -p $R/$(basename $d); cp $d/*.png $R/$(basename $d)/; done
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">NEXORA</string>|; s|<string name="title_activity_main">[^<]*</string>|<string name="title_activity_main">NEXORA</string>|' $R/values/strings.xml
          grep -n "app_name" $R/values/strings.xml
      - name: LiveKit client SDK (required for LIVE with many viewers)
        run: |
          npm i --no-save --no-package-lock livekit-client@2 esbuild
          test -s node_modules/livekit-client/dist/livekit-client.esm.mjs
          mkdir -p www/js/vendor
          npx esbuild node_modules/livekit-client/dist/livekit-client.esm.mjs --bundle --format=esm --minify --outfile=www/js/vendor/livekit-client.esm.mjs
          test -s www/js/vendor/livekit-client.esm.mjs
          grep -q 'Room' www/js/vendor/livekit-client.esm.mjs
          ls -lh www/js/vendor/livekit-client.esm.mjs
      - name: Native plugins (audio route, update opener)
        run: |
          D=android/app/src/main/java/com/m17/social
          mkdir -p $D && cp native/*.java $D/
          ls $D
      - name: Version stamp (so installed apps can detect newer builds)
        run: |
          V="1.0.${{ github.run_number }}"
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" $G
          grep -n "versionCode\|versionName" $G
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Sign APK with permanent NEXORA key
        env:
          NEXORA_KEYSTORE_B64: ${{ secrets.NEXORA_KEYSTORE_B64 }}
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$NEXORA_KEYSTORE_B64" ] && [ -n "$NEXORA_KEYSTORE_PASSWORD" ] && [ -n "$NEXORA_KEY_ALIAS" ] && [ -n "$NEXORA_KEY_PASSWORD" ]; then
            echo "$NEXORA_KEYSTORE_B64" | base64 --decode > /tmp/nexora-release.jks
            test -s /tmp/nexora-release.jks
            $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner sign --ks /tmp/nexora-release.jks --ks-key-alias "$NEXORA_KEY_ALIAS" --ks-pass env:NEXORA_KEYSTORE_PASSWORD --key-pass env:NEXORA_KEY_PASSWORD --out NEXORA.apk "$APK"
            $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose NEXORA.apk
            echo "APK signed with the permanent NEXORA key."
          else
            echo "::warning::Permanent signing secrets are not configured. This APK will not be suitable for seamless in-place upgrades."
            cp "$APK" NEXORA.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-apk
          path: NEXORA.apk
      - name: Publish download link (GitHub Release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nexora-latest --cleanup-tag -y || true
          gh release create nexora-latest NEXORA.apk --latest --title "NEXORA" --notes "أحدث إصدار من تطبيق NEXORA لأندرويد. حمّل ملف NEXORA.apk وثبّته (اسمح بالتثبيت من هذا المصدر عند الطلب)."
      - name: Publish update manifest (update-info branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_SRC: ${{ github.event.head_commit.message }}
        run: |
          mkdir /tmp/upd && cd /tmp/upd
          git init -q -b update-info
          node -e 'const n=(process.env.NOTES_SRC||"").split("\n")[0].slice(0,280);require("fs").writeFileSync("update.json",JSON.stringify({version:process.env.APP_VERSION,downloadUrl:"https://github.com/"+process.env.GITHUB_REPOSITORY+"/releases/latest/download/NEXORA.apk",notes:n}))'
          cat update.json
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add update.json; git commit -q -m "update manifest $APP_VERSION"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" update-info
